# Local development only. The passwords and keys below are throwaway values: never reuse them anywhere else.
#
#   docker compose up --build
#
# Guardian:  http://localhost:3001  (sign in as "admin" with ADMIN_INITIAL_PASSWORD below; the first sign-in
#            asks for a new password. After `docker compose down -v` the initial password works again.)
# Internal:  http://localhost:3002  (/metrics, /healthz, /readyz; bound to this machine only)
# Mailpit:   http://localhost:3003  (catches every email Guardian sends: confirmation and reset links)
# Grafana:   http://localhost:3005  (optional test app: docker compose --profile grafana up; see docs/LOCAL-GRAFANA.md)

services:
  backend:
    container_name: guardian-backend
    image: guardian-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: guardian
      DB_PASSWORD: guardian-dev
      DB_NAME: guardian
      PUBLIC_ADDR: ":3001"
      INTERNAL_ADDR: ":3002"
      ISSUER_URL: http://localhost:3001
      TRUSTED_PROXY_HOPS: "0"
      # Dev-only key (base64 of 32 bytes). Generate a real one with: openssl rand -base64 32
      KEY_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtYW55d2hlcmU=
      ADMIN_INITIAL_PASSWORD: guardian-dev-admin
      # Email goes to Mailpit (http://localhost:3003), which catches everything and delivers nothing.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      MAIL_FROM: Local Guardian <no-reply@guardian.localhost>
    ports:
      - "3001:3001"
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    container_name: guardian-postgres
    # Major version pinned on purpose: a new major cannot read the old data files.
    image: postgres:16
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian-dev
      POSTGRES_DB: guardian
    volumes:
      - postgres-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    container_name: guardian-mailpit
    image: axllent/mailpit:latest
    ports:
      # Host ports stay in the 3000 range next to Guardian. Windows often reserves ports such as 1025.
      - "127.0.0.1:3003:8025"   # web UI
      - "127.0.0.1:3004:1025"   # SMTP, for a backend run outside compose; inside compose use mailpit:1025

  # A real app that signs in through Guardian, to check the whole flow by hand (docs/LOCAL-GRAFANA.md).
  # Only started with --profile grafana, after the app is registered in Guardian and .env holds its client id
  # and secret. The browser uses localhost:3001; Grafana's own server-to-server calls use backend:3001.
  grafana:
    container_name: guardian-grafana
    image: grafana/grafana:11.3.0
    profiles: ["grafana"]
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3005
      # Grafana's own built-in user is called "admin" too; rename it so Guardian's admin can sign in.
      GF_SECURITY_ADMIN_USER: grafana-local-admin
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Guardian
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_CLIENT_ID:-set-GRAFANA_CLIENT_ID-in-.env}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET:-set-GRAFANA_CLIENT_SECRET-in-.env}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://localhost:3001/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://backend:3001/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://backend:3001/userinfo
      GF_AUTH_GENERIC_OAUTH_AUTH_STYLE: InHeader
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      # Guardian accounts may have no email; Grafana needs one, so fall back to a placeholder made from sub.
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email || join('@', [sub, 'guardian.invalid'])"
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
      # Members of grafana-admins become Grafana admins; everyone else Guardian lets in is a viewer.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'"
      GF_AUTH_SIGNOUT_REDIRECT_URL: http://localhost:3001/logout?client_id=${GRAFANA_CLIENT_ID:-}&post_logout_redirect_uri=http://localhost:3005/login
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      - backend

volumes:
  postgres-db:
