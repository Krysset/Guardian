name: backend
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian
          POSTGRES_DB: guardian_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GUARDIAN_TEST_DB: "1"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: guardian
      DB_PASSWORD: guardian
      DB_NAME: guardian_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod download && go mod verify
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 10m ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t guardian-backend:ci backend
