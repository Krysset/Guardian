name: frontend
on:
  push:
    paths: ["frontend/**", "docs/openapi.yaml", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "docs/openapi.yaml", ".github/workflows/frontend.yml"]
  # The release workflow runs these same checks before publishing.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The API types must match docs/openapi.yaml: regenerate them and fail if anything changed.
      - run: npm run api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run check
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the frontend image
        run: docker build -t guardian-frontend:ci frontend
