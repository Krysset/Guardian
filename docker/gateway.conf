# Local development only: routes like the chart's HTTPRoute or Ingress, so the frontend and backend images
# can be tried together (docker compose --profile ui up). The management UI gets exactly /, and /account,
# /admin and /_app with everything under them; everything else goes to the backend.
server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;

    location = / { proxy_pass http://frontend:8080; }
    location ~ ^/(account|admin|_app)(/|$) { proxy_pass http://frontend:8080; }

    location / {
        proxy_pass http://backend:3001;
        proxy_set_header Host $http_host;
    }
}
