# Security headers for every response of the UI. (add_header inside a location replaces the server's, so each
# location includes this file.) The script and style rules are in the page's own CSP <meta> tag; framing can
# only be refused by a header.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
