# The management UI. Every page is the same single-page app (200.html), which carries its own
# Content-Security-Policy as a <meta> tag with the hash of its start script.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    # nginx-unprivileged writes its temporary files under /tmp.
    client_body_temp_path /tmp/client_temp;

    # Kit's hashed files never change: cache them for a year.
    location /_app/immutable/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # version.json and the like: always ask again.
    location /_app/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # For the kubelet's probes.
    location = /_ui/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Home, the account area and the admin area: the app decides what to show.
    location / {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /200.html =404;
    }
}
