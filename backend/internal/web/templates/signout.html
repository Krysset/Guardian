{{define "content"}}
      <h1>Sign out of Guardian?</h1>
      <p class="sub">You will also be signed out of the apps you use through Guardian.</p>
      {{if .Username}}<p class="who">Signed in as <strong>{{.Username}}</strong></p>{{end}}
      <div class="buttons-top">
        <form method="post" action="/logout">
          <input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="id_token_hint" value="{{.IDTokenHint}}">
          <input type="hidden" name="client_id" value="{{.ClientID}}"><input type="hidden" name="post_logout_redirect_uri" value="{{.PostLogoutRedirectURI}}">
          <input type="hidden" name="state" value="{{.State}}">
          <button class="button" type="submit">Sign out</button>
        </form>
        <a class="button alt" href="/login">Cancel</a>
      </div>
{{end}}
