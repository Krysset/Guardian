{{define "content"}}
      <div class="badge-icon {{.Icon}}">{{if eq .Icon "ok"}}<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>{{else}}<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"></path></svg>{{end}}</div>
      <h1>{{.Heading}}</h1>
      <p class="sub">{{.Message}}</p>
      {{with .Link}}<div class="buttons-top"><a class="button" href="{{.Href}}">{{.Label}}</a></div>{{end}}
{{end}}
