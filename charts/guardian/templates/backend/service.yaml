# The public port only: sign-in pages, OIDC and /api/v1. Routes point here.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "guardian.fullname" . }}
  labels:
    {{- include "guardian.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "guardian.backendSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 3001
      targetPort: public
---
# Metrics and probes, for Prometheus inside the cluster. Never route to this Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "guardian.fullname" . }}-internal
  labels:
    {{- include "guardian.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    guardian.dev/service: internal
spec:
  type: ClusterIP
  selector:
    {{- include "guardian.backendSelector" . | nindent 4 }}
  ports:
    - name: metrics
      port: 3002
      targetPort: internal
