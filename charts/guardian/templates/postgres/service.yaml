{{- if eq .Values.database.mode "bundled" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "guardian.postgresName" . }}
  labels:
    {{- include "guardian.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    {{- include "guardian.postgresSelector" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "guardian.postgresName" . }}-headless
  labels:
    {{- include "guardian.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "guardian.postgresSelector" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
