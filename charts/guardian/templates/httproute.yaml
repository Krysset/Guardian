{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs is required when httpRoute.enabled is true: name the Gateway to attach to" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "guardian.fullname" . }}
  labels:
    {{- include "guardian.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- if .Values.httpRoute.hostnames }}
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
    {{- else }}
    - {{ include "guardian.host" . | quote }}
    {{- end }}
  rules:
    {{- if .Values.frontend.enabled }}
    # The management UI: exactly /, and /account, /admin and /_app with everything under them. The most
    # specific match wins, so the rest goes to the backend.
    - matches:
        - path: { type: Exact, value: / }
        - path: { type: PathPrefix, value: /account }
        - path: { type: PathPrefix, value: /admin }
        - path: { type: PathPrefix, value: /_app }
      backendRefs:
        - name: {{ include "guardian.frontendName" . }}
          port: 8080
    {{- end }}
    # Sign-in pages, OIDC, /api/v1 and the backend's static files.
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "guardian.fullname" . }}
          port: 3001
{{- end }}
