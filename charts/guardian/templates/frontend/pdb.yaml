{{- if and .Values.frontend.enabled .Values.frontend.podDisruptionBudget.enabled (gt (int .Values.frontend.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "guardian.frontendName" . }}
  labels:
    {{- include "guardian.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  minAvailable: {{ .Values.frontend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "guardian.frontendSelector" . | nindent 6 }}
{{- end }}
