# Guardian's Helm chart. Required values are marked REQUIRED; values.schema.json refuses an install without them.
# The chart generates no secrets: create them yourself (see docs/INSTALL.md).

# The public address of Guardian as browsers and apps see it, without a trailing slash. REQUIRED.
# It is the OIDC issuer, so it must not change after apps are connected. https:// turns on secure cookies.
issuerURL: ""

image:
  # The backend image, for example registry.example.com/guardian-backend. REQUIRED.
  repository: ""
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The Secret with Guardian's own secrets. REQUIRED. It must exist before the install.
secrets:
  existingSecret: ""
  keys:
    # The encryption keyring: "k1:<32 random bytes, base64>" (openssl rand -base64 32), and later
    # "k2:<new>,k1:<old>" while rotating. Encrypts the signing keys and authenticator apps in the database.
    # Mounted as a file and reread every minute (docs/INSTALL.md, "Keys").
    keyEncryptionKeys: key-encryption-keys
    # The first password of the built-in "admin" account; it must be changed at the first sign-in.
    adminInitialPassword: admin-initial-password

database:
  # "bundled": a single Postgres instance installed with the chart (development and small setups).
  # "external": an existing Postgres, for example CloudNativePG.
  mode: bundled
  # The Secret and key holding the database password. Defaults to secrets.existingSecret.
  passwordSecret: ""
  passwordKey: db-password
  # Connections per backend pod. Replicas times maxConns must stay below Postgres' max_connections.
  maxConns: 10

  external:
    host: ""
    port: 5432
    user: guardian
    name: guardian
    sslMode: require

  bundled:
    # The major version is pinned on purpose: a new major cannot read the old data files.
    image:
      repository: postgres
      tag: "16"
      pullPolicy: IfNotPresent
    user: guardian
    name: guardian
    storage:
      size: 5Gi
      # Empty uses the cluster's default storage class.
      storageClass: ""
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
    # Extra Postgres settings, passed as -c name=value.
    settings: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

replicaCount: 2

# How many reverse proxies in front of Guardian append to X-Forwarded-For (ingress controller, load balancer).
trustedProxyHops: 1

config:
  # Go durations. Empty keeps Guardian's defaults (168h idle, 720h maximum).
  sessionIdleTimeout: ""
  sessionMaxLifetime: ""
  # Failed sign-ins allowed within the window, for one account from one address and from one address in
  # total. Accounts are never locked; only the address is refused. Empty keeps the defaults (15m, 5, 50).
  loginLimits:
    window: ""
    perAccountAndIP: ""
    perIP: ""
  # Help and Privacy links in the footer of the sign-in pages; left out when empty.
  helpURL: ""
  privacyURL: ""
  logFormat: json
  logLevel: info
  # Extra environment variables for the backend, as name: value.
  extraEnv: {}

# Gateway API HTTPRoute: attaches to an existing Gateway. The chart never creates a Gateway.
httpRoute:
  enabled: false
  # For example: [{ name: main-gateway, namespace: gateway-system, sectionName: https }]
  parentRefs: []
  # Defaults to the host of issuerURL.
  hostnames: []
  annotations: {}

# A standard Ingress, as an alternative to the HTTPRoute.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # [{ secretName: guardian-tls }]; the host is taken from issuerURL.
  tls: []

resources:
  requests: { cpu: 100m, memory: 128Mi }
  # Each password check needs 64 MiB and at most 4 run at once.
  limits: { memory: 512Mi }

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
nodeSelector: {}
tolerations: []
affinity: {}
